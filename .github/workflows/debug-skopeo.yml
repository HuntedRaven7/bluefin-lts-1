name: Debug skopeo probe

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe anonymous
        id: anon
        continue-on-error: true
        run: |
          set -x
          which skopeo
          skopeo --version
          skopeo inspect --format '{{.Digest}}' docker://ghcr.io/projectbluefin/bluefin-lts-nvidia:testing
          echo "anon_exit=$?"

      - name: Probe with GITHUB_TOKEN login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          echo "${GH_TOKEN}" | skopeo login ghcr.io --username "token" --password-stdin
          skopeo inspect --format '{{.Digest}}' docker://ghcr.io/projectbluefin/bluefin-lts-nvidia:testing
          echo "auth_exit=$?"
          skopeo inspect --raw docker://ghcr.io/projectbluefin/bluefin-lts-nvidia:testing | head -c 400
