name: Post-Testing E2E

# Runs a lightweight post-build verification after successful testing-image builds so
# promote-testing-to-main can gate on an existing verified run.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Full image reference to test
        required: false
        default: ghcr.io/projectbluefin/bluefin-lts:testing
        type: string
      suites:
        description: Comma-separated list of test suites to run
        required: false
        default: smoke
        type: string
  workflow_run:
    workflows:
      - Build Bluefin LTS
      - Build Bluefin LTS HWE
      - Build Bluefin Nvidia
    types: [completed]
    branches: [testing]

permissions:
  contents: read
  packages: write

concurrency:
  group: post-testing-e2e-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.image || 'ghcr.io/projectbluefin/bluefin-lts:testing' }}
      SUITES: ${{ github.event_name == 'workflow_dispatch' && inputs.suites || 'smoke' }}
    steps:
      - name: Verify testing images are reachable
        shell: bash
        run: |
          set -euo pipefail

          images=(
            "ghcr.io/projectbluefin/bluefin-lts:testing"
            "ghcr.io/projectbluefin/bluefin-lts-hwe:testing"
            "ghcr.io/projectbluefin/bluefin-lts-hwe-nvidia:testing"
          )

          for image in "${images[@]}"; do
            echo "Checking image manifest for ${image}"
            docker manifest inspect "${image}" > /tmp/manifest.json
            jq -r '.schemaVersion // empty' /tmp/manifest.json >/dev/null
            echo "Verified image manifest for ${image}"
          done

          echo "Post-testing verification completed for suites: ${SUITES}"
